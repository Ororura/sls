name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v1.2.3; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run JUnit tests
        run: ./mvnw -B -ntp clean verify

  installers:
    name: Release installer (${{ matrix.name }})
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel
            os: macos-15-intel
            profile: mac-x64
            maven: ./mvnw
          - name: macos-apple-silicon
            os: macos-15-arm64
            profile: mac-arm
            maven: ./mvnw
          - name: windows-x64
            os: windows-2022
            profile: windows
            maven: .\\mvnw.cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build versioned installer
        run: ${{ matrix.maven }} -B -ntp clean package -DskipTests -Dapp.version=${{ needs.verify.outputs.version }} -P${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/installer/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [verify, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.dmg ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          name: SLSEleven ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
