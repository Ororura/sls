name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'release-version.txt'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(tr -d '[:space:]' < release-version.txt)"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected version v1.2.3; got: $TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists. Bump release-version.txt instead." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run JUnit tests
        run: ./mvnw -B -ntp clean verify

  installers:
    name: Release installer (${{ matrix.name }})
    needs: verify
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-intel
            os: macos-15-intel
            profile: mac-x64
            maven: ./mvnw
            shell: bash
          - name: macos-apple-silicon
            os: macos-15
            profile: mac-arm
            maven: ./mvnw
            shell: bash
          - name: windows-x64
            os: windows-2022
            profile: windows
            maven: .\\mvnw.cmd
            shell: cmd
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build versioned installer
        shell: ${{ matrix.shell }}
        run: ${{ matrix.maven }} -B -ntp clean package -DskipTests -Dapp.version=${{ needs.verify.outputs.version }} -P${{ matrix.profile }}
      - name: Give installer a platform-specific filename
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/installer/*)
          if (( ${#files[@]} != 1 )); then
            echo "Expected exactly one installer, found ${#files[@]}" >&2
            exit 1
          fi
          file="${files[0]}"
          mv "$file" "${file%.*}-${{ matrix.name }}.${file##*.}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: target/installer/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [verify, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.dmg ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SLSEleven ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
